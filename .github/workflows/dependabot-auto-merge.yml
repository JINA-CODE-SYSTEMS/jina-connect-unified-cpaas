name: Dependabot auto-merge

# Approves and enables auto-merge for low-risk Dependabot updates.
#
# Auto-merge does NOT bypass branch protection: GitHub still waits for every
# required check (lint, secret scan, Django checks, tests on 3.11 and 3.12)
# before merging. A red CI leaves the PR sitting open, exactly as today.
#
# Major version bumps are deliberately excluded and stay manual.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and auto-merge safe updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The approval is what satisfies "required approving reviews: 1".
      #
      # Patch only. "Minor" is not a small change for a framework: the pip
      # group in #213 carried Django 5.1 -> 5.2 and DRF 3.15 -> 3.17, and DRF
      # 3.17 removed rest_framework.schemas.coreapi, which settings.py still
      # referenced. That took main red along with every management command
      # (fixed in #216).
      #
      # That PR was merged by hand, not by this workflow — its checks were
      # already failing. The automation behaved correctly. But it shows what
      # a semver-minor bump can contain, and next time it could merge itself.
      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave minor and major bumps for manual review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::${{ steps.metadata.outputs.update-type }} bump (${{ steps.metadata.outputs.dependency-names }}) needs manual review; auto-merge not enabled."
