[voice-0d1da1c0-78c7-45d7-917e-d531d0cf6fa0-endpoint]
type=endpoint
context=jina-voice-inbound
disallow=all
allow=ulaw
allow=alaw
auth=voice-0d1da1c0-78c7-45d7-917e-d531d0cf6fa0-auth
aors=voice-0d1da1c0-78c7-45d7-917e-d531d0cf6fa0-aor
