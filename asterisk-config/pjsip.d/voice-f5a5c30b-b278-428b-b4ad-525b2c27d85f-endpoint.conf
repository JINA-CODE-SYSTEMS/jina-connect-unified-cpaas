[voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-endpoint]
type=endpoint
context=jina-voice-inbound
disallow=all
allow=ulaw
allow=alaw
auth=voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-auth
aors=voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-aor
from_user=u
from_domain=example.com
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-auth]
type=auth
auth_type=userpass
username=u
password=p
realm=example.com

[voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-aor]
type=aor
contact=sip:sip.example.com
qualify_frequency=60

[voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-reg]
type=registration
outbound_auth=voice-f5a5c30b-b278-428b-b4ad-525b2c27d85f-auth
server_uri=sip:sip.example.com
client_uri=sip:u@example.com
retry_interval=60
