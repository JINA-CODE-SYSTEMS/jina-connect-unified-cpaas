[voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-endpoint]
type=endpoint
context=jina-voice-inbound
disallow=all
allow=ulaw
allow=alaw
auth=voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-auth
aors=voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-aor
from_user=u
from_domain=example.com
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-auth]
type=auth
auth_type=userpass
username=u
password=p
realm=example.com

[voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-aor]
type=aor
contact=sip:sip.example.com
qualify_frequency=60

[voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-reg]
type=registration
outbound_auth=voice-c0cfa024-1fb1-4cdb-8b2f-255aa983f3f7-auth
server_uri=sip:sip.example.com
client_uri=sip:u@example.com
retry_interval=60
